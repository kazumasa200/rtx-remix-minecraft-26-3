# RTX Remix baseline configuration for Minecraft
#
# Gameplay-driven water, zone, biome, weather, time, and automatic view-distance
# profiles live under
# rtx-remix/mods/minecraft-logic/confs/. Their authoring and layer-precedence
# guide is rtx-remix/mods/minecraft-logic/README.md.

# The mod owns the Alt+X overlay toggle, so the runtime's built-in handler is
# parked on a chord Windows cannot deliver: Ctrl+Pause arrives as VK_CANCEL,
# not VK_PAUSE. The runtime cannot express "unbound"; an empty value fails to
# parse and silently keeps the default Alt+X. Its first-use guide still
# advertises this fallback on clean profiles.
rtx.remixMenuKeyBinds = CTRL, SHIFT, ALT, PAUSE
rtx.hideSplashMessage = true

# Use Minecraft/OS cursor visibility instead of Remix's software ImGui cursor.
rtx.showUICursor = false

# DLSS frame generation is off by default.
rtx.dlfg.enable = false

# Frame generation presents on a spare graphics-family queue instead of the
# compute-only one. Overlays that draw at present time, such as RivaTuner's
# Vulkan layer, issue graphics work there, which on the compute-only queue lost
# the device (REMIX-6328). Only frame generation presents on this queue, and
# the runtime falls back to the compute-only queue when the graphics family has
# none to spare. The runtime reads it at device creation.
rtx.dlfg.presentOnGraphicsQueue = True

# Vertex color is used for biome tinting (grass, leaves, etc.)
rtx.vertexColorStrength = 1.0
rtx.vertexColorIsBakedLighting = false

# First-person arms and held items are submitted through Remix's dedicated
# view-model camera for perspective correction and scene isolation.
rtx.viewModel.enable = true
rtx.viewModel.perspectiveCorrection = true

# Draw the sky matte (the Unbound clouds' dome, sun, moon, stars, cirrus, aurora)
# in scene-linear HDR instead of the game's 8-bit target. There it clipped at 1
# and was read back as sRGB: sunlit clouds turned grey beside the brighter sky
# and their shaded bases were crushed to black.
rtx.skyForceHDR = True

# Minecraft submits right-handed OpenGL winding through the Remix API.
# Disabling native face culling avoids mirrored/missing surfaces.
rtx.enableCulling = false

# Auto-exposure uses the authored bounds below (mirrored by
# PostProcessingSettings) so bright skies retain their brilliance without
# sacrificing visibility in dark areas.
rtx.autoExposure.exposureAverageMode = 0
rtx.autoExposure.autoExposureSpeed = 10
rtx.autoExposure.centerMeteringSize = 0.75
rtx.autoExposure.exposureCenterMeteringEnabled = true

# Allow user to switch between ACES shaders
rtx.showLegacyACESOption = true
# Use the current ACES transform; the legacy one skews colors.
rtx.useLegacyACES = False
# Minecraft's authored post-processing defaults live in the baseline layer so
# gameplay profiles can blend over them. The Fabric settings screen writes a
# stronger User Settings opinion when a saved override loads or the player
# explicitly changes one.
# Includes the artist's -0.75 EV bias; rtx.userBrightness remains player-owned.
rtx.localtonemap.exposure = 0.21405728
rtx.localtonemap.shadows = 1.4
rtx.localtonemap.highlights = 2.5
rtx.autoExposure.evMinValue = -2.5
rtx.autoExposure.evMaxValue = 1.5
rtx.localtonemap.exposurePreferenceSigma = 3.5
rtx.localtonemap.exposurePreferenceOffset = -0.1

# Translucent (glass/water) colored shadows and visibility
rtx.enableDirectTranslucentShadows = true
rtx.enableIndirectTranslucentShadows = true

# Thin Opaque SSS energy is incorrect on surfaces reached through PSR
# transmission, such as underwater kelp. Treat those hits as opaque for now.
rtx.subsurface.enableThinOpaqueInRefractions = false

# Keep opacity micromaps disabled for Minecraft's high-volume terrain workload.
rtx.opacityMicromap.enable = false

# Keep Remix API meshes, instances, and materials resident on the GPU instead
# of rescanning every surface, material, and BLAS on the CPU each frame. Read
# only at startup, so it must be set here rather than toggled at runtime.
rtx.gpuResidentScene = true

# Force every mesh into its own dynamic BLAS so that static terrain
# geometry is built once and never rebuilt.  Without this, surfaces
# with <50k prims land in the merged BLAS which is rebuilt every frame.
rtx.minimizeBlasMerging = true

# Keep Remix's object search and camera-cut distance near Minecraft scale.
# 10.0 keeps Remix camera-cut detection from triggering during normal flight.
rtx.uniqueObjectDistance = 10.0

# Keep NRC scene bounds stable in Minecraft's large, continuously moving world.
rtx.neuralRadianceCache.sceneBoundsWidthMeters = 600.0
rtx.neuralRadianceCache.resetSceneBoundsOnCameraCut = false

# Reduce NRC self-training feedback so cached lighting adapts faster to Minecraft-scale movement.
rtx.neuralRadianceCache.selfTrainingAttenuation = 0.1

# Reduce SHaRC/NRC shimmer on leaves
# Keep the cache query off the thin opaque and subsurface surfaces in view: it
# lit leaves and packed ice far above their surroundings at night and in rain.
rtx.spatiallyHashedRadianceCache.queryForThinOpaquePrimaryView = False
rtx.spatiallyHashedRadianceCache.maxNumFramesToAccumulate = 1000
rtx.spatiallyHashedRadianceCache.staleFrameNumber = 1024
rtx.subsurface.disableThinOpaqueInSecondaryRays = True

# Debug view (uncomment to enable):
# rtx.debugView.debugViewIdx = 5  # Is Opaque

# Disable this or will get grid lines appearing at block boundaries
rtx.useAnisotropicFiltering = false

# Sample normal and height maps linearly while keeping base textures nearest-filtered.
rtx.materials.smoothReliefMapFiltering = false

# Enable atlas/trimsheet UV looping for Minecraft block materials.
rtx.materials.enableUvBoundsLooping = true

# Minecraft submits positions in block coordinates (1 unit = 1 block ≈ 1 meter).
# Remix's volumetric froxel system is calibrated for centimeter-scale D3D9 games,
# so sceneScale=0.01 is required for atmospheric effects (god rays, haze) to appear.
rtx.sceneScale = 0.01

# Extend froxel volume to half the current world render (currently 32 chunks x 16 blocks x 1 meter per block = 512)
rtx.volumetrics.froxelMaxDistanceMeters = 256.f;

# Let volumetric lighting pass through translucent surfaces (water, glass).
rtx.volumetrics.enableTranslucentShadows = true

# Reshuffle resilience stays off: with it on, editing chunks can leave stale
# NEE cache light candidates.
rtx.neeCache.enableReshuffleResilience = false

# Fade distant terrain out (mode 3 = Coherent Noise Smooth Primary, ie blend into the sky for primary and stable worldspace noise for non-primary).
# Planar Euclidean (1) ignores the vertical axis, matching Minecraft's column-based chunk loading.
rtx.viewDistance.distanceMode = 3
rtx.viewDistance.distanceFunction = 1
rtx.viewDistance.noiseScale = 20.0

# Automatic view-distance control blends these 32-chunk endpoints toward the
# 2-chunk endpoints in confs/view_distance.conf. Auto-off leaves that layer at
# zero, restoring this maximum-distance band without a User Settings write.
rtx.viewDistance.distanceFadeMin = 358.4
rtx.viewDistance.distanceFadeMax = 409.6

rtx.ignoreSkyIfCameraInMedium = true

# Atmosphere scattering stays off: it currently produces fireflies here.
rtx.volumetrics.enableAtmosphere = false
rtx.volumetrics.atmosphereHeightMeters = 2000.0

# Daytime bloom is intentionally selective. Remix thresholds pre-tonemap scene
# radiance, so 250 suppresses ordinary sunlit surfaces and celestial billboards
# while retaining halation around only the hottest emitters. This is not the
# runtime's 0.25 default; time profiles deliberately lower the threshold and
# raise the intensity for stronger nighttime bloom.
# Use a broad radius for the daytime film-camera look, strong enough that the
# sun's glints on water, which pass the threshold under a sun lower than about
# 40 degrees, bloom: at 0.1 only a thousandth of their light was added.
rtx.bloom.steps = 8
rtx.bloom.burnIntensity = 0.5
rtx.bloom.luminanceThreshold = 250

# Improve GPU performance by reducing the number of samples
rtx.sparseRendering.enableSparseRendering = true
rtx.sparseRendering.quality = 0.3

# DLSS-RR needs the combined primary and secondary specular albedo to
# reconstruct water reflections: without it, shaded water reflects blotchy
# sky-coloured smears instead of the scene. The cost is that cloud
# reflections blur the refraction signal, so sand seen through water loses
# texture detail; a runtime-side fix for that is the right place.
rtx.rayreconstruction.combineSpecularAlbedo = true

# Wrap positions instead of recentering, so NRC resetting will not cause direct lighting flicker and temporary dark frames while moving through the world
rtx.neuralRadianceCache.wrapPositionsToSceneBounds = true

# Keep Windows from marking the window as not responding while it is unfocused
# and Minecraft's render loop never blocks for input: at an Unlimited background
# max framerate, or at any cap the frame rate does not reach.
rtx.enableInputQueuePing = True
