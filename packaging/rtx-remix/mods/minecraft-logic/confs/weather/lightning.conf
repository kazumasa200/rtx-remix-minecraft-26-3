# Lightning look: holds the exposure while a bolt flashes, so the flash lights the
# land and the sky instead of the camera exposing it away at once.
# Full while a bolt flashes and for 1.5 seconds after, then off.
# Authoring guide: ../../README.md

# rtx.conf's auto exposure follows at a speed of 10, which undid a flash within a
# fifth of a second.
rtx.autoExposure.autoExposureSpeed = 0.5
