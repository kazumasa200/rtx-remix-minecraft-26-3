# Fade mode while LOD terrain (Distant Horizons) draws past Minecraft's render
# distance. The mod gives this layer the strength of confs/view_distance_lod.conf,
# and the mode switches as soon as that strength is above zero.
#
# rtx.conf's smooth mode (3) blends a surface past the fade band into the sky. A
# ray that crossed glass or water before it reached the sky counts as past every
# band, so the sky seen through them lost its tint. The noise mode (2) keeps it.
# At the LOD radius, tens of thousands of blocks out, the two look alike; at
# Minecraft's own render distance the smooth mode keeps the last blocks fading
# into the sky, which the noise mode cuts away, so this layer stays off without
# LOD terrain.
rtx.viewDistance.distanceMode = 2
